          schema:
            allOf:
            - $ref: '#/definitions/helpers.HttpResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: Refresh access token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with the provided details
      parameters:
