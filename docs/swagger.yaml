definitions:
  handlers.articleInput:
    properties:
      content:
        description: Content of the article
        example: This is the content of the article.
        type: string
      title:
        description: Title of the article
        example: My First Article
        type: string
    required:
    - content
    - title
    type: object
  handlers.changePasswordInput:
    properties:
      new_password:
        maxLength: 200
        minLength: 8
        type: string
      old_password:
        maxLength: 200
        minLength: 8
        type: string
    required:
    - new_password
    - old_password
    type: object
  handlers.commentInput:
    properties:
      article_id:
        description: ID of the comment
        example: "1"
        type: string
      content:
        description: Content of the comment
        example: This is the content of the comment.
        type: string
    required:
    - article_id
    - content
    type: object
  handlers.deleteAccountInput:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  handlers.loginInput:
    properties:
      email:
        type: string
      password:
        maxLength: 200
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handlers.logoutInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.refreshToken:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.resetPasswordInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.signinInput:
    properties:
      biography:
        maxLength: 250
        type: string
      email:
        type: string
      firstName:
        maxLength: 50
        minLength: 1
        type: string
      lastName:
        maxLength: 25
        type: string
      password:
        maxLength: 200
        minLength: 8
        type: string
    required:
    - email
    - firstName
    - password
    type: object
  handlers.submitResetPasswordInput:
    properties:
      new_password:
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  handlers.updateInput:
    properties:
      biography:
        type: string
      firstName:
        type: string
      lastName:
        type: string
    required:
    - biography
    - firstName
    - lastName
    type: object
  handlers.verifyEmailInput:
    properties:
      otp:
        type: string
      userID:
        type: string
    required:
    - otp
    - userID
    type: object
  helpers.HttpResponse:
    properties:
      code:
        type: integer
      data:
        additionalProperties: true
        type: object
      message:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/articles:
    get:
      description: Retrieve all articles
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved articles
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Failed to fetch articles
          schema:
            additionalProperties: true
            type: object
      summary: Get all articles
      tags:
      - articles
  /api/v1/articles/{id}:
    delete:
      description: Delete an article by its ID
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Article deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Failed to delete article
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Article not found for deletion
          schema:
            additionalProperties: true
            type: object
      summary: Delete an article by ID
      tags:
      - articles
    get:
      description: Retrieve an article by its ID
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Article retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Article not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch article
          schema:
            additionalProperties: true
            type: object
      summary: Get an article by ID
      tags:
      - articles
    patch:
      consumes:
      - application/json
      description: Update an article by its ID
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: string
      - description: Article input
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/handlers.articleInput'
      produces:
      - application/json
      responses:
        "200":
          description: Article updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid update data
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Article not found for update
          schema:
            additionalProperties: true
            type: object
      summary: Update an article by ID
      tags:
      - articles
  /api/v1/articles/create:
    post:
      consumes:
      - application/json
      description: Create a new article with the provided title and content
      parameters:
      - description: Article input
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/handlers.articleInput'
      produces:
      - application/json
      responses:
        "201":
          description: Article created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input data
          schema:
            additionalProperties: true
            type: object
      summary: Create a new article
      tags:
      - articles
  /api/v1/articles/search:
    get:
      description: Search articles by title using a query string
      parameters:
      - description: Search query
        in: query
        name: title
        type: string
      - description: 'Search query format: 2025-02-8 00:00:00.00000+00'
        in: query
        name: publishedAt
        type: string
      - description: 'Search query format: 2025-02-8 00:00:00.00000+00'
        in: query
        name: publishedAtGT
        type: string
      - description: 'Search query format: 2025-02-8 00:00:00.00000+00'
        in: query
        name: publishedAtLT
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Articles found successfully
          schema:
            additionalProperties: true
            type: object
        "404":
          description: No articles found with given data
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to search articles
          schema:
            additionalProperties: true
            type: object
      summary: Search articles by title
      tags:
      - articles
  /api/v1/auth/authenticate:
    get:
      description: Validate the access token of the user
      produces:
      - application/json
      responses:
        "200":
          description: Authentication successful
          schema:
            allOf:
            - $ref: '#/definitions/helpers.HttpResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "401":
          description: Authentication failed
          schema:
            allOf:
            - $ref: '#/definitions/helpers.HttpResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: Authenticate user
      tags:
      - auth
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the password of the currently authenticated user
      parameters:
      - description: Password change data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.changePasswordInput'
      produces:
