      summary: User logout
      tags:
      - auth
  /api/v1/auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Refresh the user's access token using the refresh token
      parameters:
      - description: Refresh token data
        in: body
        name: input
        required: true
