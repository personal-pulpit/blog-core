definitions:
  handlers.articleInput:
    properties:
      categories:
        description: Categories of the article
        items:
          type: string
        type: array
      content:
        description: Content of the article
        example: This is the content of the article.
        type: string
      title:
        description: Title of the article
        example: My First Article
        type: string
    required:
    - categories
    - content
    - title
    type: object
  handlers.bookmarkInput:
    properties:
      article_id:
        example: "1"
        type: string
    required:
    - article_id
    type: object
  handlers.changePasswordInput:
    properties:
      new_password:
        maxLength: 200
        minLength: 8
        type: string
      old_password:
        maxLength: 200
        minLength: 8
        type: string
    required:
    - new_password
    - old_password
    type: object
  handlers.commentInput:
    properties:
      article_id:
        description: ID of the comment
        example: "1"
        type: string
      content:
        description: Content of the comment
        example: This is the content of the comment.
        type: string
    required:
    - article_id
    - content
    type: object
  handlers.createCategoryInput:
    properties:
      name:
        example: Technology
        type: string
    required:
    - name
    type: object
  handlers.deleteAccountInput:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  handlers.likeInput:
    properties:
      article_id:
        description: ID of the article
        example: "1"
        type: string
    required:
    - article_id
    type: object
  handlers.loginInput:
    properties:
      email:
        type: string
      password:
        maxLength: 200
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handlers.logoutInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.refreshToken:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.resetPasswordInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.signinInput:
    properties:
      biography:
        maxLength: 250
        type: string
      email:
        type: string
      firstName:
        maxLength: 50
        minLength: 1
        type: string
      lastName:
        maxLength: 25
        type: string
      password:
        maxLength: 200
        minLength: 8
        type: string
    required:
    - email
    - firstName
    - password
    type: object
  handlers.submitResetPasswordInput:
    properties:
      new_password:
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  handlers.updateInput:
    properties:
      biography:
        type: string
      firstName:
        type: string
      lastName:
        type: string
    required:
    - biography
    - firstName
    - lastName
    type: object
  handlers.verifyEmailInput:
    properties:
      otp:
        type: string
      userID:
        type: string
    required:
    - otp
    - userID
    type: object
  helpers.HttpResponse:
    properties:
      code:
        type: integer
      data:
        additionalProperties: true
        type: object
      message:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/articles:
    get:
      description: Retrieve all articles
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved articles
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Failed to fetch articles
          schema:
            additionalProperties: true
            type: object
      summary: Get all articles
      tags:
      - articles
    post:
      consumes:
